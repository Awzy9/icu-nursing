name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Draft validators and draft register are up to date
        run: npm run validate:all && npm run register:drafts && git diff --exit-code src/content
      - name: Seed is up to date
        run: npx tsx scripts/generate-seed.ts && git diff --exit-code supabase/seed.sql
      - name: Fixture seed files are up to date
        run: npx tsx scripts/seed-synthetic-questions.ts && git diff --exit-code supabase/seed_question_fixtures.sql supabase/seed_case_fixtures.sql supabase/seed_skill_fixtures.sql supabase/seed_medication_fixtures.sql
      - name: Database migrations + RLS tests
        run: npm run test:db
      - name: Mobile app - install, typecheck, bundle for Android and iOS, scan the bundles for clinical drafts and secrets
        run: |
          npm run mobile:install
          npm run typecheck:mobile
          npm run export:android --prefix mobile -- --output-dir dist
          (cd mobile && npx expo export --platform ios --output-dir dist-ios)
          npx tsx scripts/check-mobile-bundle.ts mobile/dist
          npx tsx scripts/check-mobile-bundle.ts mobile/dist-ios
      - name: Build
        run: npm run build
        env: { NEXT_PUBLIC_SUPABASE_URL: "", NEXT_PUBLIC_SUPABASE_ANON_KEY: "" }
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npx playwright test --reporter=line,json
        env: { CI: "true", PLAYWRIGHT_JSON_OUTPUT_NAME: pw-results.json }
      - name: Working edition learning experience
        run: npx playwright test --config playwright.working.config.ts
        env: { CI: "true" }
      - name: Summarise end-to-end failures
        if: failure()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("pw-results.json","utf8"));
            const walk = (s, p=[]) => [...(s.specs||[]).flatMap(sp => sp.tests.filter(t => t.status!=="expected" && t.status!=="skipped").map(t => `${t.projectName} :: ${[...p, sp.title].join(" > ")} :: ${t.status} :: ${(t.results.at(-1)?.error?.message||"").split("\n")[0].slice(0,200)}`)), ...(s.suites||[]).flatMap(c => walk(c, [...p, c.title]))];
            console.log("FAILED E2E TESTS:"); r.suites.flatMap(s => walk(s)).forEach(x => console.log(" - " + x));'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-results, path: "test-results\npw-results.json", if-no-files-found: ignore }
