name: Mobile acceptance
on:
  pull_request:
    paths:
      - "mobile/**"
      - "tests/mobile/**"
      - "scripts/qa-local-preflight*.mjs"
      - "content/working-ecg.json"
      - "content/working-waveforms.json"
      - "public/images/equipment/**"
      - ".github/workflows/mobile-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install shared workspace dependencies
        run: npm ci
      - name: Install Expo mobile dependencies
        run: npm run mobile:install
      - name: Mobile unit, source safety, accessibility, image license and waveform tests
        run: npx vitest run tests/mobile --reporter=dot
      - name: Local QA preflight regression tests
        run: node --test scripts/qa-local-preflight.test.mjs
      - name: Mobile TypeScript
        run: npm run typecheck:mobile
      - name: Export iOS JavaScript bundle
        run: cd mobile && npx expo export --platform ios --output-dir dist-ios
      - name: Export Android JavaScript bundle
        run: npm run export:android --prefix mobile -- --output-dir dist
      - name: Verify bundle excludes secrets and internal draft records
        run: |
          npx tsx scripts/check-mobile-bundle.ts mobile/dist-ios
          npx tsx scripts/check-mobile-bundle.ts mobile/dist
      - name: Export isolated QA variant for both platforms (synthetic endpoints only)
        working-directory: mobile
        env:
          APP_VARIANT: isolated-replay
          EXPO_PUBLIC_PROGRESS_REPLAY: "true"
          EXPO_PUBLIC_SUPABASE_URL: https://qa-backend.example.org
          EXPO_PUBLIC_SITE_URL: https://qa-site.example.org
          ISOLATED_REPLAY_SUPABASE_URL: https://qa-backend.example.org
          ISOLATED_REPLAY_SITE_URL: https://qa-site.example.org
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture
        run: |
          npx expo config --type public --json > /tmp/nursing-qa-config.json
          node -e 'const c=require("/tmp/nursing-qa-config.json"); if(c.name!=="Nursing Mastery QA" || c.ios.bundleIdentifier!=="com.nursingmastery.app.qa" || c.android.package!=="com.nursingmastery.app.qa" || c.scheme!=="nursingmasteryqa" || c.updates.enabled!==false || c.extra.siteUrl!==process.env.EXPO_PUBLIC_SITE_URL) throw Error("Isolated QA app configuration mismatch");'
          npx expo export --platform ios --output-dir dist-qa-ios
          npx expo export --platform android --output-dir dist-qa-android
      - name: Verify isolated QA bundles
        run: |
          npx tsx scripts/check-mobile-bundle.ts mobile/dist-qa-ios
          npx tsx scripts/check-mobile-bundle.ts mobile/dist-qa-android
          node -e 'const fs=require("node:fs"),path=require("node:path");const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);for(const d of ["mobile/dist-qa-ios","mobile/dist-qa-android"]){const files=walk(d).filter(f=>/\.(hbc|js)$/.test(f));const b=files.map(f=>fs.readFileSync(f,"latin1")).join("");for(const s of ["https://qa-backend.example.org","https://qa-site.example.org","nursingmasteryqa"]){if(!b.includes(s))throw Error("QA bundle missing expected configuration: "+s);}}'
      - name: Report acceptance scope
        run: |
          echo "Native app source checks and iOS/Android JavaScript exports complete."
          echo "Real iPhone TestFlight visual tests, camera/VoiceOver interaction,"
          echo "network-disconnected image behavior and account sync across devices"
          echo "remain manual release gates; this workflow does not claim those passed."
